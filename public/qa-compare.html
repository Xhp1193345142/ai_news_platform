<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Signal Visual QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #050711; color: #f7f9ff; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
      figure { margin: 0; }
      figcaption { margin: 0 0 8px; color: #cbd7e8; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border: 1px solid rgb(255 255 255 / 12%); }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>Source visual target</figcaption><img src="/assets/black-hole-auth.png" alt="Source target" /></figure>
      <figure><figcaption>Vue implementation</figcaption><img src="/assets/qa-login-implementation.png" alt="Vue implementation" /></figure>
    </main>
  </body>
</html>
